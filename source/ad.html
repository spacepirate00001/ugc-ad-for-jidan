<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:HL;font-weight:600;src:url(hind-siliguri-latin-600-normal.woff2)}
@font-face{font-family:HL;font-weight:700;src:url(hind-siliguri-latin-700-normal.woff2)}
@font-face{font-family:HB;font-weight:600;src:url(hind-siliguri-bengali-600-normal.woff2)}
@font-face{font-family:HB;font-weight:700;src:url(hind-siliguri-bengali-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a1f5c}
body{font-family:HL,HB,'Noto Color Emoji',sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;display:none}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center}
.dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,15,50,.55),rgba(5,15,50,.25) 40%,rgba(5,15,50,.75))}
.blueprint{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 35%,#1d4fc4 0%,#0d2a85 55%,#06154a 100%);}
.grid{position:absolute;inset:0;background-image:
  linear-gradient(rgba(120,190,255,.13) 2px,transparent 2px),linear-gradient(90deg,rgba(120,190,255,.13) 2px,transparent 2px),
  linear-gradient(rgba(120,190,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,190,255,.06) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px}
.card{position:absolute;left:60px;top:400px;width:960px;height:640px;border-radius:40px;overflow:hidden;
  border:10px solid #fff;box-shadow:0 30px 80px rgba(0,0,0,.55);background:#fff}
.card .img{position:absolute;inset:0;background-size:cover;background-position:center}
.cap{position:absolute;left:50px;right:50px;text-align:center;line-height:1.5}
.cap .w{display:inline-block;margin:0 6px}
.box{display:inline;background:#fff;color:#0b1b4a;font-weight:700;font-size:78px;padding:6px 26px;border-radius:22px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.62}
.big{font-weight:700;font-size:96px;line-height:1.25;text-shadow:0 0 2px #000,0 6px 0 #000,0 0 30px rgba(0,0,0,.7)}
.yl{color:#ffd60a}
.cy{color:#5ee7ff}
.pill{display:inline-block;background:#ffd60a;color:#0b1b4a;font-weight:700;font-size:58px;padding:10px 36px;border-radius:60px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.badge{position:absolute;top:200px;left:0;right:0;text-align:center}
.badge span{display:inline-block;background:rgba(0,0,0,.55);border:3px solid #5ee7ff;color:#5ee7ff;font-weight:700;font-size:44px;padding:6px 30px;border-radius:50px;letter-spacing:1px}
#bars{position:absolute;top:50px;left:30px;right:30px;display:flex;gap:8px;z-index:10}
#bars div{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
#bars i{display:block;height:100%;background:#fff;width:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none}
#vig{position:absolute;inset:0;z-index:9;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.55)}
.row{display:flex;align-items:center;gap:26px;background:rgba(255,255,255,.96);color:#0b1b4a;border-radius:30px;padding:26px 34px;margin:0 0 30px;
  font-weight:700;font-size:56px;box-shadow:0 14px 40px rgba(0,0,0,.4);line-height:1.25}
.row .ic{font-size:66px}
.row small{display:block;font-size:38px;font-weight:600;color:#33508f}
.logo{position:absolute;left:50%;width:520px;transform:translateX(-50%)}
.brand{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:70px;letter-spacing:2px;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.5)}
.tag{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:44px;color:#5ee7ff}
.phone{display:block;font-weight:700;font-size:104px;letter-spacing:2px;color:#fff;text-shadow:0 6px 0 #000,0 0 30px rgba(0,0,0,.6)}
</style></head>
<body>
<div id="stage"></div>
<div id="vig"></div>
<div id="bars"></div>
<div id="flash"></div>
<script>
const BN=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const services=[
 ['civil','বিল্ডিং ও <span class="yl">সিভিল</span> কনস্ট্রাকশন','ফাউন্ডেশন • পাইলিং • ফ্লোরিং'],
 ['steelfab','<span class="yl">স্টিল স্ট্রাকচার</span> ফ্যাব্রিকেশন','PEB শেড • ট্রাস • ইরেকশন'],
 ['mech','<span class="yl">মেকানিক্যাল</span> ওয়ার্কশপ ⚙️','লেদ • মিলিং • ওয়েল্ডিং'],
 ['wiring','<span class="yl">ইন্ডাস্ট্রিয়াল</span> ওয়্যারিং ⚡','প্যানেল • বাসবার • কেবল ট্রে'],
 ['solar','<span class="yl">সোলার</span> পাওয়ার প্ল্যান্ট ☀️','5kW – 500kW'],
 ['gen','<span class="yl">জেনারেটর</span> ইনস্টলেশন 🔌','10kVA – 2000kVA'],
 ['comp','<span class="yl">এয়ার কম্প্রেসর</span> ও ড্রায়ার','5HP – 500HP'],
 ['boiler','গ্যাস ও ইলেকট্রিক <span class="yl">বয়লার</span> 🔥','ইনস্টলেশন • ডিস্কেলিং'],
 ['fire','<span class="yl">ফায়ার লাইন</span> ও স্টিম লাইন 🚒','হাইড্রেন্ট • স্প্রিংকলার'],
 ['acplant','<span class="yl">এসি প্ল্যান্ট</span> ❄️','5 – 500 টন • VRF • চিলার'],
 ['cctv','<span class="yl">সিসিটিভি</span> ক্যামেরা 📹','IP ক্যামেরা • মোবাইল অ্যাপ'],
 ['ups','<span class="yl">UPS • IPS • VFD</span> 🔋','পাওয়ার ব্যাকআপ সলিউশন'],
 ['mccb','<span class="yl">MCB • MCCB</span> • ক্যাবল 💡','LED লাইটিং • সার্জ প্রোটেকশন'],
];
const S=[];
S.push({dur:3.5,html:`<div class="bg" style="background-image:url(blur/gen.jpg)"></div><div class="dim"></div>
 <div class="card kb" style="top:620px"><div class="img" style="background-image:url(crops/gen.jpg)"></div></div>
 <div class="cap pop" style="top:230px"><span class="big">ফ্যাক্টরির কাজ নিয়ে</span><br><span class="big yl">টেনশনে আছেন? 😩</span></div>
 <div class="cap pop d2" style="top:1380px"><span class="box">মেশিন বন্ধ মানেই লস!</span></div>`});
S.push({dur:3.5,html:`<div class="bg" style="background-image:url(blur/mech.jpg)"></div><div class="dim"></div>
 <div class="card kb"><div class="img" style="background-image:url(crops/mech.jpg)"></div></div>
 <div class="cap pop" style="top:1150px"><span class="box">শোনেন, আমি <span class="yl" style="color:#1d4fc4">এক জায়গায়</span><br>সব সমাধান পেয়ে গেছি 👇</span></div>`});
S.push({dur:3,html:`<div class="blueprint"></div><div class="grid"></div>
 <img class="logo zoomin" src="logo.png" style="top:470px">
 <div class="brand pop d2" style="top:900px">A.H.I ENGINEERING<br>CORPORATION</div>
 <div class="tag pop d3" style="top:1130px">— We Build Your Trust, We Ensure Quality —</div>
 <div class="cap pop d4" style="top:1330px"><span class="pill">সিভিল • মেকানিক্যাল • ইলেকট্রিক্যাল</span></div>`});
services.forEach(([img,cap,sub],i)=>S.push({dur:2,svc:i,html:`<div class="bg" style="background-image:url(blur/${img}.jpg)"></div><div class="dim"></div>
 <div class="badge pop"><span>সার্ভিস ${BN(String(i+1).padStart(2,'0'))} / ${BN(services.length)}</span></div>
 <div class="card kb"><div class="img" style="background-image:url(crops/${img}.jpg)"></div></div>
 <div class="cap pop" style="top:1130px"><span class="box">${cap.replace(/class="yl"/,'style="color:#1d4fc4"')}</span></div>
 <div class="cap pop d2" style="top:1420px"><span class="pill">${sub}</span></div>`}));
S.push({dur:4,html:`<div class="bg" style="background-image:url(blur/steam.jpg)"></div><div class="dim" style="background:rgba(5,15,50,.6)"></div>
 <div class="cap pop" style="top:260px"><span class="big">কেন <span class="yl">A.H.I</span>?</span></div>
 <div style="position:absolute;left:70px;right:70px;top:560px">
  <div class="row slide s1"><span class="ic">✅</span><div>১০+ বছরের অভিজ্ঞতা<small>অভিজ্ঞ ইঞ্জিনিয়ার ও টেকনিশিয়ান টিম</small></div></div>
  <div class="row slide s2"><span class="ic">✅</span><div>BNBC • IEC • NFPA স্ট্যান্ডার্ড<small>সেফটি ও কোয়ালিটি ফার্স্ট</small></div></div>
  <div class="row slide s3"><span class="ic">✅</span><div>২৪/৭ ইমার্জেন্সি সাপোর্ট<small>ফ্যাক্টরি • গার্মেন্টস • কমার্শিয়াল</small></div></div>
 </div>`});
S.push({dur:4.5,html:`<div class="blueprint"></div><div class="grid"></div>
 <div class="cap pop" style="top:240px"><span class="big">আমাদের <span class="cy">অফিস</span> ও<br><span class="cy">ওয়ার্কশপ</span> 📍</span></div>
 <div style="position:absolute;left:70px;right:70px;top:640px">
  <div class="row slide s1"><span class="ic">📍</span><div>ঢাকা — মিরপুর<small>হেড অফিস: কাফরুল • ওয়ার্কশপ: রূপনগর</small></div></div>
  <div class="row slide s2"><span class="ic">📍</span><div>কুষ্টিয়া — কোর্টপাড়া<small>ব্রাঞ্চ অফিস • ওয়ার্কশপ: মঙ্গলবাড়িয়া</small></div></div>
 </div>
 <div class="cap pop d4" style="top:1330px"><span class="pill">সারা দেশে সার্ভিস 🇧🇩</span></div>`});
S.push({dur:6,html:`<div class="blueprint"></div><div class="grid"></div>
 <img class="logo zoomin" src="logo.png" style="top:200px;width:340px">
 <div class="brand pop" style="top:470px;font-size:58px">A.H.I ENGINEERING CORPORATION</div>
 <div class="cap pop d2" style="top:640px"><span class="big yl">এখনই কল করুন 📞</span></div>
 <div class="cap pop d3 pulse" style="top:820px"><span class="phone">01712-964111</span><span class="phone">01831-366663</span></div>
 <div class="cap pop d4" style="top:1150px"><span class="box" style="font-size:48px">✉️ ahi.engcorporation@gmail.com</span></div>
 <div class="cap pop d5" style="top:1330px;font-size:46px;font-weight:600">প্রোপ্রাইটর: S.M.A ASGOR</div>
 <div class="cap pop d5" style="top:1460px"><span class="pill">We Build Your Trust 🤝</span></div>`});

let acc=0;S.forEach(s=>{s.start=acc;acc+=s.dur});
window.TOTAL=acc; window.SCENES=S.map(s=>s.start);
const stage=document.getElementById('stage'),bars=document.getElementById('bars'),flash=document.getElementById('flash');
S.forEach(s=>{const d=document.createElement('div');d.className='scene';d.innerHTML=s.html;stage.appendChild(d);s.el=d;
  s.pops=[...d.querySelectorAll('.pop,.zoomin,.slide')];s.kb=d.querySelector('.kb');s.bg=d.querySelector('.bg');s.pulse=d.querySelector('.pulse')});
// story bars: intro, logo, services(1), trust, loc, cta
const groups=[[0,1],[2,2],[3,15],[16,16],[17,17],[18,18]];
groups.forEach(()=>{const b=document.createElement('div');b.innerHTML='<i></i>';bars.appendChild(b)});
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const back=x=>{const c=1.9;x=cl(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const eo=x=>1-Math.pow(1-cl(x),3);
window.render=function(t){
  let idx=S.findIndex(s=>t>=s.start&&t<s.start+s.dur); if(idx<0) idx=S.length-1;
  S.forEach((s,i)=>s.el.style.display=i===idx?'block':'none');
  const s=S[idx],lt=t-s.start,p=lt/s.dur;
  // handheld shake on whole stage + zoom punch at scene start
  const punch=1+0.12*Math.pow(1-eo(lt/0.35),2);
  const sx=Math.sin(t*1.9)*7+Math.sin(t*5.3)*2,sy=Math.cos(t*1.4)*6+Math.sin(t*4.1)*2,r=Math.sin(t*0.9)*0.35;
  stage.style.transform=`translate(${sx}px,${sy}px) rotate(${r}deg) scale(${punch*1.02})`;
  if(s.bg) s.bg.style.transform=`scale(${1.05+0.05*p})`;
  if(s.kb){const im=s.kb.querySelector('.img');s.kb.style.transform=`rotate(${-1.6+1.2*p}deg) scale(${0.9+0.1*back(lt/0.45)})`;
    im.style.transform=`scale(${1.06+0.1*p}) translateX(${(idx%2?-1:1)*(18-36*p)}px)`;}
  s.pops.forEach(e=>{
    const m=e.className.match(/[ds](\d)/);const del=(m?+m[1]:0)*0.22+0.08;const x=(lt-del)/0.38;
    if(e.classList.contains('slide')){e.style.opacity=cl(x*1.6);e.style.transform=`translateX(${(1-eo(x))*-700}px)`;}
    else if(e.classList.contains('zoomin')){e.style.opacity=cl(x*2);e.style.transform=`translateX(-50%) scale(${0.3+0.7*back(x)}) rotate(${(1-eo(x))*-20}deg)`;}
    else {e.style.opacity=cl(x*2.2);e.style.transform=`translateY(${(1-eo(x))*60}px) scale(${0.65+0.35*back(x)})`;}
  });
  if(s.pulse&&lt>1.2) s.pulse.style.transform=`scale(${1+0.04*Math.sin((lt-1.2)*Math.PI*4)})`;
  flash.style.opacity=(idx>0?0.55:0)*Math.pow(1-cl(lt/0.18),2) + cl((t-(TOTAL-0.6))/0.6)*0;
  stage.style.opacity=1-cl((t-(TOTAL-0.5))/0.5)*0.0;
  [...bars.children].forEach((b,gi)=>{const[g0,g1]=groups[gi];const a=S[g0].start,e=S[g1].start+S[g1].dur;b.firstChild.style.width=cl((t-a)/(e-a))*100+'%'});
};
render(0);
</script></body></html>
